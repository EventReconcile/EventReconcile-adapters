<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Adapter workflow</title><desc id="desc">A real export is validated and normalized into the core input contract while retaining source evidence.</desc><rect width="1200" height="340" rx="18" fill="#071d1d"/><g font-family="Arial" text-anchor="middle"><g fill="#0d3935" stroke="#79f2c0" stroke-width="2"><rect x="55" y="105" width="190" height="100" rx="14"/><rect x="310" y="105" width="220" height="100" rx="14"/><rect x="595" y="105" width="220" height="100" rx="14"/><rect x="880" y="105" width="260" height="100" rx="14"/></g><g fill="#e5fff7"><text x="150" y="145" font-size="21">Real export</text><text x="150" y="174" font-size="21">NDJSON</text><text x="420" y="145" font-size="21">Validate</text><text x="420" y="174" font-size="21">bounds + source</text><text x="705" y="145" font-size="21">Normalize</text><text x="705" y="174" font-size="21">identity + coverage</text><text x="1010" y="145" font-size="21">Core input</text><text x="1010" y="174" font-size="21">+ raw evidence</text></g><g stroke="#55c7ff" stroke-width="4" fill="none"><path d="M245 155h65M530 155h65M815 155h65"/></g><g fill="#55c7ff"><path d="m300 145 15 10-15 10zM585 145l15 10-15 10zM870 145l15 10-15 10z"/></g></g></svg>
